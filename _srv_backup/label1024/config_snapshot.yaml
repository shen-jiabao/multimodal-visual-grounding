data:
  root: /data/dataset
  queries_file: queries/queries.json
  visible_dir: Images/visible
  infrared_dir: Images/infrared
  depth_dir: Images/depth
model:
  type: qwen3_vl
  name_or_path: checkpoints/Qwen3-VL-8B-Instruct
  device: auto
  use_half_precision: true
  box_threshold: 0.2
  text_threshold: 0.15
inference:
  max_queries_per_prompt: 20
  enable_multimodal_fusion: true
  low_light_threshold: 60
  fusion_mode: low_light
  fusion_ir_weight: 1.0
  fusion_depth_weight: 1.0
  fusion_gate_scale: 30.0
  fallback: none
  enable_depth_prior: false
  multimodal_input_mode: split
  chain_enforce: 'off'
  chain_gap_ratio: 0.05
  chain_max_shift: 0.0
  diag_dump: true
  diag_dir: outputs/diag
qwen:
  output_mode: multi_box
  max_new_tokens: 1024
  enable_thinking: false
  multi_box_id: false
  default_score: 1.0
  coord_scale_x: 1.0
  coord_scale_y: 1.0
  feature_cache: true
  cache_max_entries: 4
  num_samples: 1
  sample_temperature: 0.7
  sample_top_p: 0.9
  vote_iou_threshold: 0.5
  vote_min_votes: 1
output:
  dir: outputs
  predictions_json: predictions.json
  submission_zip: submission.zip
logging:
  level: INFO
postprocess:
  fallback_bbox:
  - 0.49
  - 0.49
  - 0.51
  - 0.51
